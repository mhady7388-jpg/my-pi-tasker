<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiTasker | منصة المهام المصغرة</title>
    
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            padding: 20px; 
            color: #333; 
            text-align: center;
        }
        .container { 
            max-width: 500px; 
            margin: auto; 
            background: white; 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        h1 { color: #673ab7; font-size: 26px; margin-bottom: 10px; }
        p { color: #666; font-size: 16px; }
        .task-list { margin-top: 25px; }
        .task { 
            border: 1px solid #eee; 
            padding: 15px; 
            border-radius: 12px; 
            margin-bottom: 15px; 
            text-align: right; 
            background-color: #fafafa;
            transition: 0.3s;
        }
        .task:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
        .task h3 { margin: 0 0 10px 0; font-size: 18px; color: #444; }
        .reward { color: #4caf50; font-weight: bold; font-size: 14px; display: block; margin-bottom: 10px; }
        .btn { 
            background-color: #673ab7; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 16px; 
            font-weight: bold;
        }
        .btn:hover { background-color: #512da8; }
        footer { margin-top: 30px; font-size: 12px; color: #aaa; }
    </style>
</head>
<body>

<div class="container">
    <h1>PiTasker 🚀</h1>
    <p>أهلاً بكِ.. نفذي المهام واجمعي عملات Pi</p>
    <hr style="border: 0; border-top: 1px solid #eee;">

    <div class="task-list">
        <div class="task">
            <h3>متابعة حساب كريبتو على X</h3>
            <span class="reward">المكافأة: 0.2 Pi</span>
            <button class="btn" onclick="handleTask('تويتر')">ابدأ المهمة الآن</button>
        </div>

        <div class="task">
            <h3>مشاهدة فيديو تحليل عملات</h3>
            <span class="reward">المكافأة: 0.5 Pi</span>
            <button class="btn" onclick="handleTask('يوتيوب')">شاهد واربح</button>
        </div>
    </div>

    <footer>حقوق النشر محفوظة لتطبيق PiTasker © 2026</footer>
</div>

<script>
    const Pi = window.Pi;
    try {
        Pi.init({ version: "2.0", sandbox: true });
    } catch (e) {
        console.error("فشل تحميل نظام Pi", e);
    }

    function handleTask(type) {
        alert("جارٍ فتح مهمة " + type + "... بعد التنفيذ سيتم مراجعة الدليل وإرسال العملات لمحفظتك.");
    }
</script>

</body>
</html>
